[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotrust-enclave"
version = "1.0.0"
description = "High-Assurance Zero-Trust Microsegmentation Gateway & Ephemeral SPIFFE Workload Attestation Engine"
readme = "README.md"
authors = [{ name = "Huighlet Eyram Zowonu" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zerotrust = "zerotrust.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
